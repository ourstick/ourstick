name: Audit

# The dependencies against RustSec's advisories, every week and whenever
# the lock file changes: an advisory published after a release is seen
# without waiting for the next change.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock, apps/app/package-lock.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Fails on a vulnerability; warnings (unmaintained, unsound) are shown.
      - run: cargo audit

  # The app window's JavaScript dependencies (the build tools aside).
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: npm audit --omit=dev --audit-level=low
        working-directory: apps/app
