[package]
name = "ourstick-app"
description = "The OurStick desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not for crates.io: the crates make sense only together, in this repository.
publish = false
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

# The app is a library, so that Android and iOS can load it (ADR 0027);
# `src/main.rs` runs it on a desktop.
[lib]
name = "ourstick_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ourstick-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ourstick-core = { path = "../../../crates/ourstick-core" }
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
qrcode.workspace = true
serde.workspace = true
anyhow.workspace = true
# Windows: the class id of a stick's File Explorer entry (ADR 0023).
blake3.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

# Linux has its own tray (ksni, src/tray/linux.rs); elsewhere Tauri's.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
clipboard-win.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
arboard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
ksni.workspace = true
gtk.workspace = true
