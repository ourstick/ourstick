[package]
name = "ourstick-core"
description = "Core library for OurStick — a USB stick in a link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not for crates.io: the crates make sense only together, in this repository.
publish = false

[dependencies]
tokio.workspace = true
futures.workspace = true
fs4.workspace = true
icu_normalizer.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
postcard.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
keyring-core.workspace = true
argon2.workspace = true
rand.workspace = true
rusqlite.workspace = true
notify.workspace = true
data-encoding.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
# ADR 0017: the blobs' hash trees (outboards).
bao-tree.workspace = true
irpc.workspace = true
bytes.workspace = true
# ADR 0033: the notice of a new version.
serde_json.workspace = true
reqwest.workspace = true
semver.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
