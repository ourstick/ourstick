[workspace]
resolver = "2"
members = [
    "crates/ourstick-core",
    "crates/ourstick-cli",
    "apps/app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ourstick/ourstick"
homepage = "https://ourstick.com"
authors = ["Giorgos"]
rust-version = "1.91"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

# hashing / crypto
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "3"
rand = "0.8"

# secrets: keyring-core with an explicitly chosen backend (never a mock);
# async-io runtime so blocking calls never collide with tokio.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
# macOS: the login ("legacy") keychain. The "protected" store needs entitlements
# an unsigned app does not have.
apple-native-keyring-store = { version = "1", features = ["keychain"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# db
rusqlite = { version = "0.32", features = ["bundled"] }

# fs / misc
walkdir = "2"
# The desktop app (docs/gui-spec.md). Linux needs webkit2gtk-4.1 and friends,
# see the README.
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-single-instance = "2.5"
# The ticket as a QR code in the terminal; no image/svg rendering.
qrcode = { version = "0.14", default-features = false }
# Key-file passphrases read from the terminal without echo.
rpassword = "7.5"
notify = "7"
tempfile = "3"
# Tests only: build a consistent outboard for deliberately wrong data.
bao-tree = { version = "0.16.1", default-features = false }
data-encoding = "2"

# networking — versions from `cargo add iroh iroh-blobs` (2026-09-28), not from memory.
# unstable-net-report: the network diagnosis behind "why a relay". Its API is
# not semver-stable; only transport/iroh/ touches it.
iroh = { version = "1.2.0", features = ["unstable-net-report"] }
iroh-blobs = "0.103.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
