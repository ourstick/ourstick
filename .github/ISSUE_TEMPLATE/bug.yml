name: Something does not work
description: A bug in the app or the command-line tool.
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real sharing link** here, nor in a log or a screenshot: a link carries the stick's key and the sender's network addresses. Make a test stick if you need one, and remove it after.

        A security problem goes by e-mail, not here: see [SECURITY.md](https://github.com/ourstick/ourstick/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version and system
      description: The app shows its version at the foot of its window; `ourstick --version` for the command-line tool.
      placeholder: 0.2.0 on Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you did, and what happened
      description: Step by step, and what you expected instead.
    validations:
      required: true
  - type: checkboxes
    id: link
    attributes:
      label: No link
      options:
        - label: There is no real sharing link in this report, its logs or its screenshots.
          required: true
