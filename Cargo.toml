[workspace]
resolver = "2"
members = [
    "crates/ourstick-core",
    "crates/ourstick-cli",
    "apps/app/src-tauri",
]
# Vendored dependencies are not ours to test or lint.
exclude = ["third_party"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ourstick/ourstick"
homepage = "https://ourstick.com"
authors = ["Georgios Kakavelakis <hi@ourstick.com>"]
rust-version = "1.91"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# free disk space, for the owner's suitcase budget (ADR 0007)
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# one form for stick names (NFC, ADR 0009 §3); already built for iroh (url → idna)
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

# hashing / crypto
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "3"
rand = "0.8"

# secrets: keyring-core with an explicitly chosen backend (never a mock);
# async-io runtime so blocking calls never collide with tokio.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
# macOS: the login ("legacy") keychain, and the data protection keychain
# ("protected", ADR 0021) for the app signed with its entitlements.
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }
# Windows: the user's Credential Manager.
windows-native-keyring-store = "1.1"
# Android: the Android Keystore (ADR 0027). Pinned to the commit of its PR
# #27 (a lost Keystore key fails instead of being replaced), which no release
# has yet; a release that holds it replaces this rev.
android-native-keyring-store = { git = "https://github.com/open-source-cooperative/android-native-keyring-store", rev = "bd485ded65d57715ba616c37dd58f15bdbc1c85b", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# db
rusqlite = { version = "0.32", features = ["bundled"] }

# fs / misc
# The desktop app (docs/gui-spec.md). Linux needs webkit2gtk-4.1 and friends,
# see the README.
# tray-icon only where the app uses Tauri's tray (see apps/app/src-tauri).
tauri = { version = "2.12", features = ["image-png"] }
tauri-build = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-opener = "2.6"
tauri-plugin-dialog = "2.8"
# Android: the app reads the files the user chose through Kotlin (ADR
# 0029); the version Tauri and wry already build.
jni = "0.21"
# The app keeps Linux awake while someone downloads (logind's Inhibit).
zbus = "5"
# Linux tray: a StatusNotifierItem of our own, which receives the XDG
# activation token (see third_party/ksni/OURSTICK.md), and GTK 3 to raise the
# window with it. gtk 0.18 is the one Tauri already uses.
ksni = "0.3.6"
gtk = "0.18"
# Windows: keeping the system awake while someone downloads
# (SetThreadExecutionState). The same version windows-native-keyring-store uses.
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
# macOS: the app never reopened by "Reopen windows when logging back in";
# only our own login entry starts it there (ADR 0024). The versions Tauri
# already uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
# The ticket as a QR code in the terminal; no image/svg rendering.
qrcode = { version = "0.14", default-features = false }
# Key-file passphrases read from the terminal without echo.
rpassword = "7.5"
notify = "7"
tempfile = "3"
# Tests only: build a consistent outboard for deliberately wrong data.
bao-tree = { version = "0.16.1", default-features = false }
# ADR 0017: the owner's own store for iroh-blobs (its client and channel
# types), the versions iroh-blobs 0.103 uses.
irpc = "0.17.0"
bytes = "1.12"
data-encoding = "2"

# networking — versions from `cargo add iroh iroh-blobs` (2026-09-28), not from memory.
# unstable-net-report: the network diagnosis behind "why a relay". Its API is
# not semver-stable; only transport/iroh/ touches it.
iroh = { version = "1.2.0", features = ["unstable-net-report"] }
iroh-blobs = "0.103.0"

[patch.crates-io]
ksni = { path = "third_party/ksni" }
# ADR 0018: 0.103.1 with its store runtime shut down without waiting for
# itself (third_party/iroh-blobs/OURSTICK.md).
iroh-blobs = { path = "third_party/iroh-blobs" }

# Line tables only: a panic or backtrace still names its file and line, at
# a fraction of full debug info's size (the build folder had reached 300 GB
# with dozens of test binaries). Tests use it too.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
