name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reads the code, nothing more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The runner's disk and memory are small for dozens of test binaries:
  # no debug info (a test's panic still names its file and line), and
  # fewer links at once.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions by commit, so that a moved tag changes nothing here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The desktop app (apps/app) is part of the workspace: its system
      # libraries, as in the README.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: df -h / && cargo test --workspace

  # The phone apps (ADR 0027): the workspace checked for Android with the
  # NDK the runner carries; rusqlite, ring and blake3 compile C even for a
  # check.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy for Android
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android30-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android30-clang"
          cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
